version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ollama-proxy-postgres
    environment:
      POSTGRES_DB: ollama_proxy
      POSTGRES_USER: ollama_user
      POSTGRES_PASSWORD: ollama_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ollama_user -d ollama_proxy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ollama-proxy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-proxy:
    build: .
    container_name: ollama-proxy
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Admin Panel
  frontend:
    build: ./frontend
    container_name: ollama-proxy-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://ollama-proxy:8000
      - NEXT_PUBLIC_ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: unless-stopped
    depends_on:
      - ollama-proxy

volumes:
  postgres_data:
  redis_data:
