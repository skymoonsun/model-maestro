services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: maestro-postgres
    environment:
      POSTGRES_DB: maestro
      POSTGRES_USER: maestro_user
      POSTGRES_PASSWORD: maestro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - maestro-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U maestro_user -d maestro" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: maestro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - maestro-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  maestro:
    build: .
    container_name: maestro
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
      - ./app:/app/app
      - ./alembic:/app/alembic
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maestro-net

  # Frontend Admin Panel
  frontend:
    build: ./frontend
    container_name: maestro-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://maestro:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: unless-stopped
    depends_on:
      - maestro
    networks:
      - maestro-net

volumes:
  postgres_data:
  redis_data:

networks:
  maestro-net:
    name: maestro-net
    driver: bridge
