version: '3.8'

services:
  ollama-proxy:
    build: .
    container_name: ollama-proxy
    network_mode: "host"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  
  # Celery worker for background tasks
  celery-worker:
    build: .
    container_name: celery-worker
    network_mode: "host"
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - ollama-proxy
  
  # Celery beat for periodic tasks
  celery-beat:
    build: .
    container_name: celery-beat
    network_mode: "host"
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - ollama-proxy

