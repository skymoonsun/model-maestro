services:
  maestro:
    build: .
    container_name: maestro
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - maestro-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - BACKEND_URL=http://maestro:8000
    container_name: maestro-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://maestro:8000
    restart: unless-stopped
    depends_on:
      - maestro
    networks:
      - maestro-net

networks:
  maestro-net:
    name: maestro-net
    driver: bridge
